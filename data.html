<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Consolas, monospace;
}

body{
    background:url("bg2.png");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:#f5d7d7;
    min-height:100vh;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    linear-gradient(
        rgba(40,0,0,.8),
        rgba(0,0,0,.85)
    );
    z-index:-1;
}

header{
    background:rgba(30,0,0,.95);
    border-bottom:4px solid #700;
    padding:30px;
    text-align:center;
    box-shadow:0 0 40px rgba(255,0,0,.4);
}

h1{
    font-size:60px;
    color:#ff4444;
    text-shadow:
    0 0 10px red,
    0 0 30px darkred;
}

.subtitle{
    margin-top:10px;
    opacity:0.7;
}

.container{
    width:1100px;
    max-width:95%;
    margin:auto;
    margin-top:40px;
}

.section{
    background:rgba(20,0,0,.85);
    border:2px solid #660000;
    padding:25px;
    margin-bottom:30px;
    box-shadow:
    0 0 25px rgba(255,0,0,.15);
}

.section h2{
    color:#ff6666;
    margin-bottom:15px;
}

.section p{
    line-height:1.7;
}

.file{
    background:black;
    border-left:5px solid red;
    margin-top:15px;
    padding:15px;
    color:#ff8888;
}

.warning{
    text-align:center;
    margin:40px 0;
    color:red;
    font-size:30px;
    animation:pulse 2s infinite;
}

@keyframes pulse{

    0%{
        opacity:1;
    }

    50%{
        opacity:.4;
    }

    100%{
        opacity:1;
    }

}

footer{
    text-align:center;
    padding:30px;
    opacity:.5;
}

</style>
