<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lieux - Green Valley Products</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Consolas, monospace;
}

body{
    background:black;
    color:white;
    min-height:100vh;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    linear-gradient(
        rgba(0,0,0,.65),
        rgba(0,0,0,.85)
    );
    z-index:-1;
}

header{
    text-align:center;
    padding:40px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

h1{
    font-size:55px;
    letter-spacing:5px;
}

.subtitle{
    opacity:.6;
    margin-top:10px;
}

.gallery{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:40px;
    padding:50px;
}

.place{

    width:500px;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.1);

    border-radius:20px;

    overflow:hidden;

    transition:.3s;

}

.place:hover{

    transform:translateY(-8px);

    box-shadow:
    0 0 30px rgba(255,255,255,.15);

}

.place img{

    width:100%;
    height:500px;

    object-fit:cover;

}

.place-title{

    text-align:center;

    padding:15px;

    background:rgba(0,0,0,.5);

    font-size:18px;

    letter-spacing:2px;

}

.next{

    width:100%;

    display:flex;

    justify-content:center;

    margin-bottom:60px;

}

.next button{

    padding:20px 40px;

    font-size:22px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    background:white;

    color:black;

    transition:.3s;

}

.next button:hover{

    transform:scale(1.05);

}

</style>
</head>

<body>

<header>

<h1>ARCHIVES DES INSTALLATIONS</h1>

<div class="subtitle">
Accès restreint
</div>

</header>

<div class="gallery">

<div class="place">
<img src="lieu1.png">
<div class="place-title">SECTEUR 01</div>
</div>

<div class="place">
<img src="lieu2.png">
<div class="place-title">SECTEUR 02</div>
</div>

<div class="place">
<img src="lieu3.png">
<div class="place-title">SECTEUR 03</div>
</div>

<div class="place">
<img src="lieu4.png">
<div class="place-title">SECTEUR 04</div>
</div>

<div class="place">
<img src="lieu5.png">
<div class="place-title">SECTEUR 05</div>
</div>

<div class="place">
<img src="lieu6.png">
<div class="place-title">SECTEUR 06</div>
</div>

<div class="place">
<img src="lieu7.png">
<div class="place-title">SECTEUR 07</div>
</div>

<div class="place">
<img src="lieu8.png">
<div class="place-title">SECTEUR 08</div>
</div>

<div class="place">
<img src="lieu9.png">
<div class="place-title">SECTEUR 09</div>
</div>

</div>

<div class="next">
<button onclick="window.location.href='instrument.html'">
Aller à la salle d'instrument
</button>
</div>

</body>
</html>
